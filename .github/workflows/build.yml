name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write        # push the container image to GHCR

jobs:
  build-windows:
    # Gate on the suite. Every job here ran in PARALLEL with `test` and none of
    # them read its verdict, so a tagged tree with failing tests still built
    # installers, published a GitHub Release and (since 4.0.1) pushed a
    # `:latest` container image. `tests.yml` does not cover this: it triggers on
    # branch pushes, not tags, so the tagged tree's ONLY test run is the one
    # below — the one nothing was waiting for.
    #
    # Costs ~5 minutes of latency per release. Publishing a broken build
    # faster is not a win.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller pawpoller.spec --noconfirm

      - name: Package release
        # FLAT zip — contents (`PawPoller.exe`, `_internal/…`) at the ROOT, NOT
        # wrapped in a top-level `PawPoller/` folder. The in-app self-updater
        # robocopy-/MIRs the extracted zip straight onto the install dir; a
        # wrapper folder made it nest the new build under `PawPoller\` AND purge
        # the real `_internal`, corrupting the install (missing schema.sql on next
        # launch — 2.162.1). `Compress-Archive -Path PawPoller` produced that
        # wrapper; `ZipFile.CreateFromDirectory` archives the folder's CONTENTS at
        # the root, deterministically across PowerShell versions.
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $src = Join-Path $PWD 'dist\PawPoller'
          $zip = Join-Path $PWD 'dist\PawPoller-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $zip)

      # Read APP_VERSION from config.py so the installer filename + the
      # Add/Remove Programs entry both carry the real version without
      # duplicating it in two places.
      - name: Read app version
        id: version
        shell: powershell
        run: |
          $line = Select-String -Path config.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw 'APP_VERSION not found in config.py' }
          $version = $line.Matches[0].Groups[1].Value
          Write-Host "Detected version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Inno Setup ships pre-installed on github's windows-latest runner
      # (under "C:\Program Files (x86)\Inno Setup 6\" — verified
      # 2026-05-20). Falls back to choco install if a future runner
      # image drops it.
      - name: Build installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & "$iscc" /DMyAppVersion="${{ steps.version.outputs.version }}" installer\PawPoller.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc exited $LASTEXITCODE" }

      # NOTE: no upload-artifact here — the binaries are published to the
      # GitHub Release below (free storage). Uploading them as Actions
      # artifacts too was duplicate storage that overflowed the 500MB
      # included quota and blocked Actions. Releases are the canonical
      # distribution; grab builds from the Releases page.
      # Release body from the hand-written CHANGELOG entry (generate_release_notes
      # only yields a bare compare link on this direct-commit repo — no PRs).
      - name: Extract release notes
        run: python installer/changelog_extract.py "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/PawPoller-windows-x64.zip
            installer/Output/PawPoller-Setup-*.exe
          body_path: RELEASE_NOTES.md

  build-linux:
    needs: test          # see build-windows for why
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # System deps:
      #   WeasyPrint runtime libs (libpango, libcairo, libgdk-pixbuf, …)
      #   libnotify-bin so notify-send is documented as a runtime expectation
      #   libgl1 / libegl1 / libxcb-* — Qt6 platform plugin runtime deps
      #   libxkbcommon-x11-0, libdbus-1-3 — Qt6 cross-platform input/notify
      #   libxcb-cursor0 — added in Qt6.5+, missing on stock ubuntu-22.04
      - name: Install system dependencies
        # libfuse2 is what AppImages need to mount themselves at runtime.
        # ubuntu-22.04 ships libfuse3 by default — without libfuse2 the
        # appimagetool .AppImage download below can't execute itself.
        # build-appimage.sh also falls back to --appimage-extract-and-run
        # if FUSE is unavailable, but installing the lib is the cleaner
        # path on CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 \
            libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core \
            libnotify-bin \
            libfuse2 \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xkb1 libxcb-cursor0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller pawpoller.spec --noconfirm

      - name: Read app version
        id: version
        run: |
          version=$(grep -E '^APP_VERSION\s*=\s*"' config.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$version" ]]; then echo "APP_VERSION not found in config.py" >&2; exit 1; fi
          echo "Detected version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: |
          chmod +x installer/build-appimage.sh
          installer/build-appimage.sh "${{ steps.version.outputs.version }}"

      # Same CHANGELOG-derived body as build-windows (idempotent — both jobs may
      # create/update the release depending on which finishes first).
      - name: Extract release notes
        run: python installer/changelog_extract.py "${{ steps.version.outputs.version }}"

      # No upload-artifact — the AppImage is attached to the GitHub Release
      # below (free). See the note in build-windows.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/PawPoller-*-x86_64.AppImage
          body_path: RELEASE_NOTES.md

  build-image:
    needs: test          # see build-windows for why
    # A prebuilt image turns self-hosting from "clone the repo, install a
    # toolchain and wait for a build that OOMs on a 1 GB box" into one
    # `docker compose up -d`. Building from source still works and is still
    # documented — this is an additional path, not a replacement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Lower-cases the owner: GHCR rejects an image reference with capitals,
      # and github.repository_owner keeps whatever case the account uses.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pawpoller" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 covers Raspberry Pi and Oracle's free ARM tier — the two
          # cheapest ways to run this, so it is not optional.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Container image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "⚠ A package is PRIVATE on first publish. Make it public once:" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile → Packages → pawpoller → Package settings → Change visibility." >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-server.txt

      - name: Run tests
        # pytest (not unittest discover): two pytest-style modules
        # (test_integration_posting, test_platform_posters) get silently
        # skipped by unittest discovery. pytest picks up everything —
        # 91 tests vs unittest's 30.
        run: python -m pytest tests/ -v

      - name: Syntax check
        run: python -m py_compile config.py server.py main.py dashboard.py
