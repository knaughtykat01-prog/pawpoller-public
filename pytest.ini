[pytest]
# ⚠ `python_files` is pinned deliberately, and narrowly (3.17.4).
#
# `tests/` holds two different kinds of file: the actual suite (`test_*.py`)
# and a pile of one-off operator scripts that talk to LIVE platforms and post
# real content — `bulk_ao3_drafts.py`, `bulk_sf_drafts.py`,
# `bulk_inkbunny_drafts.py`, `edit_sqw_after_fixes.py`,
# `fa_changestory_canary.py`, and others.
#
# Nothing collected them, but only because there was no pytest config at all,
# so the default glob happened not to match. That safety was implicit — and it
# stopped being good enough the moment `tests.yml` started running the suite on
# EVERY push and pull request. Broadening `python_files`, or renaming one of
# those scripts to `test_*.py`, would have GitHub runners posting drafts to real
# accounts on every commit, from datacenter IPs, against accounts that include
# the one PawPoller must never touch (FA account_id=10, a friend's).
#
# Note this is NARROWER than pytest's default, which also matches `*_test.py`.
# Nothing in the suite uses that form, and leaving it out means a file cannot
# become collectable by being named the other way round.
python_files = test_*.py
testpaths = tests

# The suite is ~1,700 tests and a few minutes; -q keeps CI logs readable.
addopts = -q
